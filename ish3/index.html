<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serverless hisoblagich</title>
  <style>
    :root{--ink:#172554;--muted:#475569;--accent:#4f46e5;--border:#c7d2fe;--soft:#f5f3ff}
    *{box-sizing:border-box}
    body{font:16px Arial,sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);color:var(--ink);margin:0;padding:32px}
    main{max-width:640px;margin:48px auto;background:#fff;padding:32px;border:1px solid #e0e7ff;border-radius:18px;box-shadow:0 16px 40px rgba(49,46,129,.12)}
    h1{color:#3730a3;margin-top:0}
    p{color:var(--muted);line-height:1.6}
    label,input,button{display:block;width:100%;margin:12px 0}
    input,button{padding:13px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px}
    input{color:var(--ink);background:#fff}
    input:focus{outline:3px solid rgba(99,102,241,.18);border-color:#6366f1}
    button{background:var(--accent);color:#fff;border:0;cursor:pointer;font-weight:700;transition:background .15s,transform .15s}
    button:hover{background:#4338ca;transform:translateY(-1px)}
    pre{white-space:pre-wrap;background:var(--soft);color:#312e81;padding:16px;border:1px solid #e0e7ff;border-radius:10px}
    small{color:#64748b}
  </style>
</head>
<body><main>
  <h1>Serverless hisoblagich</h1>
  <p>Qiymatni kiriting. Hisoblash bulutdagi alohida funksiya orqali bajariladi.</p>
  <label for="amount">Qiymat (so‘m)</label>
  <input id="amount" type="number" min="0" step="100" value="100000">
  <button id="calculate">12% sinov stavkasi bilan hisoblash</button>
  <pre id="result">Natija shu yerda ko‘rinadi.</pre>
  <p><small>Bu o‘quv namunasidir; amaldagi soliq hisoboti uchun mo‘ljallanmagan.</small></p>
</main>
<script>
  document.getElementById('calculate').addEventListener('click', async () => {
    const amount = Number(document.getElementById('amount').value);
    const result = document.getElementById('result');
    result.textContent = 'Hisoblanmoqda...';
    try {
      const response = await fetch('/api/calculate', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({amount})
      });
      const data = await response.json();
      result.textContent = response.ok
        ? `Asosiy summa: ${data.amount.toLocaleString('uz-UZ')} so‘m\n12% sinov qiymati: ${data.tax.toLocaleString('uz-UZ')} so‘m\nJami: ${data.total.toLocaleString('uz-UZ')} so‘m`
        : data.error;
    } catch (_) {
      result.textContent = 'Funksiyaga ulanib bo‘lmadi. Deploy holatini tekshiring.';
    }
  });
</script></body>
</html>
