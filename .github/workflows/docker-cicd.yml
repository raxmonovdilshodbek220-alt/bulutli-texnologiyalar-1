name: docker-cicd
on:
  push:
    branches: [main]
    paths:
      - 'ish2/**'
      - '.github/workflows/docker-cicd.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t orders-demo:ci ./ish2
      - name: Start container and check response
        run: |
          docker run --detach --rm --name orders-demo -p 8080:8080 orders-demo:ci
          for n in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
          curl --fail -X POST http://127.0.0.1:8080/hisobla \
            -H 'Content-Type: application/json' \
            -d '{"narx":12500,"miqdor":2}'
          docker stop orders-demo
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: ./ish2
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bulutli-orders:latest
            ghcr.io/${{ github.repository_owner }}/bulutli-orders:${{ github.sha }}

